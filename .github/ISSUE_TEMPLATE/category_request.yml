name: 🧹 Cleanup Category Request
description: Propose a new application cache, developer tool, or temporary folder to clean
labels: [enhancement, new-category]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new safe cleanup category for CrapCleaner!
  - type: input
    id: app_name
    attributes:
      label: Application / Tool Name
      placeholder: e.g. Cursor IDE, Unreal Engine, Deno, Blender
    validations:
      required: true
  - type: textarea
    id: cache_paths
    attributes:
      label: Target Path(s)
      description: |
        Where are the junk/cache files stored? Give the paths for every platform and install
        method you know about - Flatpak and Snap sandbox an app's data somewhere different
        from the distro package, so all three are worth listing.
      placeholder: |
        Windows:  %LOCALAPPDATA%\MyTool\cache
        Windows:  %APPDATA%\MyTool\GPUCache
        Linux:    ~/.cache/mytool
        Flatpak:  ~/.var/app/org.example.MyTool/cache/mytool
        Snap:     ~/snap/mytool/current/.cache/mytool
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Recommended Safety Level
      options:
        - Safe (Always safe to remove, auto-regenerated without delay)
        - Low Risk (Safe, but first launch after cleanup may recompile or redownload)
        - Review Required (User should review before deleting)
        - Dangerous (Protected data)
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Description & Behavior
      description: Explain why these files are safe to delete and what happens on next launch.
    validations:
      required: true
