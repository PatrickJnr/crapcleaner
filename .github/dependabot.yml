version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Requirements are ranges, not pins. Only raise a floor when the existing range
    # cannot accept the new release; security advisories are reported separately and
    # are unaffected by this.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ["*"]
