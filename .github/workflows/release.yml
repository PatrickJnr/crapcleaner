name: Release & Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Release tag to build and update. Leave empty to use the tag this run was triggered from.'
        required: false
        default: ''

jobs:
  verify:
    name: Test before release
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from, so
          # rebuilding a tag would publish current master under that tag's name.
          ref: ${{ github.event.inputs.target_tag || github.ref }}
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0             libxcb-xfixes0 libfontconfig1 libdbus-1-3 libxcb-glx0 libxcb-shm0 libxcb-sync1             libxcb-xinput0 libx11-xcb1 libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-dev.txt
      - name: Verify the tag matches the application version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.target_tag || github.ref_name }}"
          python scripts/check_release_version.py "$TAG"

      - name: Lint with Ruff
        # One platform only: mypy resolves this codebase's sys.platform branches
        # differently per OS, and Windows is the side CI gates on.
        if: runner.os == 'Windows'
        run: |
          ruff check crapcleaner tests scripts
          ruff format --check crapcleaner tests scripts
      - name: Type check with mypy
        if: runner.os == 'Windows'
        run: mypy crapcleaner

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build-windows-exe:
    needs: verify
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from, so
          # rebuilding a tag would publish current master under that tag's name.
          ref: ${{ github.event.inputs.target_tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-build.txt
      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm --clean CrapCleaner.spec
      - name: Verify the Built Executable Reports the Release Version
        shell: bash
        run: |
          EXPECTED=$(python -c "from crapcleaner.constants import VERSION; print(VERSION)")
          REPORTED=$(./dist/CrapCleaner.exe --version | tr -d '\r' | grep -Eo '[0-9]+(\.[0-9]+)+' | head -1)
          echo "reported $REPORTED, expected $EXPECTED"
          test "$REPORTED" = "$EXPECTED"
      - name: Generate SHA-256 Checksum
        run: |
          cd dist
          Get-FileHash CrapCleaner.exe -Algorithm SHA256 | Format-List > checksum-windows.txt
          Get-Content checksum-windows.txt
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CrapCleaner-Windows-x64
          path: |
            dist/CrapCleaner.exe
            dist/checksum-windows.txt

  build-linux-bin:
    needs: verify
    # Built on the oldest supported runner on purpose: a PyInstaller binary links
    # against the build machine's glibc, so building on ubuntu-latest would refuse
    # to start on any distro older than that runner.
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from, so
          # rebuilding a tag would publish current master under that tag's name.
          ref: ${{ github.event.inputs.target_tag || github.ref }}
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libfontconfig1 libdbus-1-3 libxcb-glx0 libxcb-shm0 libxcb-sync1 \
            libxcb-xinput0 libx11-xcb1 libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-build.txt
      - name: Build Standalone Linux Binary
        run: |
          pyinstaller --noconfirm --clean CrapCleaner.spec
          chmod +x dist/crapcleaner-linux-x86_64
      - name: Verify the Built Binary Reports the Release Version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          EXPECTED=$(python -c "from crapcleaner.constants import VERSION; print(VERSION)")
          REPORTED=$(./dist/crapcleaner-linux-x86_64 --version | grep -Eo '[0-9]+(\.[0-9]+)+' | head -1)
          echo "reported $REPORTED, expected $EXPECTED"
          test "$REPORTED" = "$EXPECTED"
      - name: Build the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # An AppDir is just a tree with a desktop entry, an icon, and an AppRun that
          # starts the thing. The binary is already self-contained, so nothing else
          # needs collecting into it.
          mkdir -p AppDir/usr/bin
          cp dist/crapcleaner-linux-x86_64 AppDir/usr/bin/crapcleaner
          chmod +x AppDir/usr/bin/crapcleaner

          # Drawn from the application's own icon code, so the packaged icon cannot
          # drift from the one it shows in its window.
          python scripts/render_icon.py AppDir/crapcleaner.png 256
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp AppDir/crapcleaner.png AppDir/usr/share/icons/hicolor/256x256/apps/crapcleaner.png

          cp packaging/crapcleaner.desktop AppDir/crapcleaner.desktop
          mkdir -p AppDir/usr/share/applications
          cp packaging/crapcleaner.desktop AppDir/usr/share/applications/crapcleaner.desktop

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/crapcleaner" "$@"
          APPRUN
          sed -i 's/^          //' AppDir/AppRun
          chmod +x AppDir/AppRun

          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # GitHub runners have no FUSE, so appimagetool cannot mount itself.
          ./appimagetool --appimage-extract-and-run AppDir dist/CrapCleaner-x86_64.AppImage
          chmod +x dist/CrapCleaner-x86_64.AppImage
      - name: Verify the AppImage Reports the Release Version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          EXPECTED=$(python -c "from crapcleaner.constants import VERSION; print(VERSION)")
          # Extract rather than mount, for the same missing-FUSE reason.
          REPORTED=$(./dist/CrapCleaner-x86_64.AppImage --appimage-extract-and-run --version             | grep -Eo '[0-9]+(\.[0-9]+)+' | head -1)
          echo "AppImage reported $REPORTED, expected $EXPECTED"
          test "$REPORTED" = "$EXPECTED"
      - name: Package Tarball and Checksum
        run: |
          cd dist
          tar -czvf crapcleaner-linux-x86_64.tar.gz crapcleaner-linux-x86_64
          sha256sum crapcleaner-linux-x86_64 > checksum-linux.txt
          sha256sum crapcleaner-linux-x86_64.tar.gz >> checksum-linux.txt
          sha256sum CrapCleaner-x86_64.AppImage >> checksum-linux.txt
          cat checksum-linux.txt
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CrapCleaner-Linux-x64
          path: |
            dist/crapcleaner-linux-x86_64
            dist/crapcleaner-linux-x86_64.tar.gz
            dist/CrapCleaner-x86_64.AppImage
            dist/checksum-linux.txt

  publish-release:
    needs: [build-windows-exe, build-linux-bin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from, so
          # rebuilding a tag would publish current master under that tag's name.
          ref: ${{ github.event.inputs.target_tag || github.ref }}
      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: CrapCleaner-Windows-x64
          path: release-dist/windows
      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: CrapCleaner-Linux-x64
          path: release-dist/linux
      - name: Consolidate Release Assets and Compute Checksums
        run: |
          mkdir -p release-assets
          cp release-dist/windows/CrapCleaner.exe release-assets/
          cp release-dist/linux/crapcleaner-linux-x86_64 release-assets/
          cp release-dist/linux/crapcleaner-linux-x86_64.tar.gz release-assets/
          cp release-dist/linux/CrapCleaner-x86_64.AppImage release-assets/
          chmod +x release-assets/CrapCleaner-x86_64.AppImage
          cd release-assets
          sha256sum CrapCleaner.exe crapcleaner-linux-x86_64 crapcleaner-linux-x86_64.tar.gz             CrapCleaner-x86_64.AppImage > checksums.txt
          cat checksums.txt
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/CrapCleaner.exe
            release-assets/crapcleaner-linux-x86_64
            release-assets/crapcleaner-linux-x86_64.tar.gz
            release-assets/CrapCleaner-x86_64.AppImage
      - name: Determine Target Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.target_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Extract Release Notes & Title from CHANGELOG.md
        id: release_meta
        run: |
          python scripts/extract_changelog.py "${{ steps.tag_info.outputs.tag }}" -o release_notes.md -t release_title.txt
          echo "title=$(cat release_title.txt)" >> $GITHUB_OUTPUT
          cat release_notes.md
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release_notes.md
          files: |
            release-assets/CrapCleaner.exe
            release-assets/crapcleaner-linux-x86_64
            release-assets/crapcleaner-linux-x86_64.tar.gz
            release-assets/CrapCleaner-x86_64.AppImage
            release-assets/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: false
