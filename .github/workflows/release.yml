name: Release & Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Release Tag to build and update (e.g. v1.0.7.1, v1.0.8)'
        required: false
        default: 'v1.0.8'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm --clean CrapCleaner.spec
      - name: Generate SHA-256 Checksum
        run: |
          cd dist
          Get-FileHash CrapCleaner.exe -Algorithm SHA256 | Format-List > checksum-windows.txt
          Get-Content checksum-windows.txt
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrapCleaner-Windows-x64
          path: |
            dist/CrapCleaner.exe
            dist/checksum-windows.txt

  build-linux-bin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libfontconfig1 libdbus-1-3 libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xinput0 libx11-xcb1 libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: Build Standalone Linux Binary
        run: |
          pyinstaller --noconfirm --clean CrapCleaner.spec
          chmod +x dist/crapcleaner-linux-x86_64
      - name: Package Tarball and Checksum
        run: |
          cd dist
          tar -czvf crapcleaner-linux-x86_64.tar.gz crapcleaner-linux-x86_64
          sha256sum crapcleaner-linux-x86_64 > checksum-linux.txt
          sha256sum crapcleaner-linux-x86_64.tar.gz >> checksum-linux.txt
          cat checksum-linux.txt
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrapCleaner-Linux-x64
          path: |
            dist/crapcleaner-linux-x86_64
            dist/crapcleaner-linux-x86_64.tar.gz
            dist/checksum-linux.txt

  publish-release:
    needs: [build-windows-exe, build-linux-bin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: CrapCleaner-Windows-x64
          path: release-dist/windows
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: CrapCleaner-Linux-x64
          path: release-dist/linux
      - name: Consolidate Release Assets and Compute Checksums
        run: |
          mkdir -p release-assets
          cp release-dist/windows/CrapCleaner.exe release-assets/
          cp release-dist/linux/crapcleaner-linux-x86_64 release-assets/
          cp release-dist/linux/crapcleaner-linux-x86_64.tar.gz release-assets/
          cd release-assets
          sha256sum CrapCleaner.exe crapcleaner-linux-x86_64 crapcleaner-linux-x86_64.tar.gz > checksums.txt
          cat checksums.txt
      - name: Determine Target Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.target_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Extract Release Notes & Title from CHANGELOG.md
        id: release_meta
        run: |
          python scripts/extract_changelog.py "${{ steps.tag_info.outputs.tag }}" -o release_notes.md -t release_title.txt || echo "Release ${{ steps.tag_info.outputs.tag }}" > release_notes.md
          TITLE=$(cat release_title.txt 2>/dev/null || true)
          if [ -z "$TITLE" ]; then
            TITLE="${{ steps.tag_info.outputs.tag }}"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          cat release_notes.md
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release_notes.md
          files: |
            release-assets/CrapCleaner.exe
            release-assets/crapcleaner-linux-x86_64
            release-assets/crapcleaner-linux-x86_64.tar.gz
            release-assets/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: false
