name: Batch Rebuild Past Releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'JSON list of tags to rebuild in parallel'
        required: false
        default: '["v1.0.7.1", "v1.0.7", "v1.0.6", "v1.0.5", "v1.0.4", "v1.0.3", "v1.0.2", "v1.0.1", "v1.0.0"]'

jobs:
  build:
    name: Rebuild ${{ matrix.tag }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(github.event.inputs.tags || '["v1.0.7.1", "v1.0.7", "v1.0.6", "v1.0.5", "v1.0.4", "v1.0.3", "v1.0.2", "v1.0.1", "v1.0.0"]') }}
        os: [windows-latest, ubuntu-22.04]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Tag Code
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }}
          path: repo-tag

      - name: Checkout Master Build Tools
        uses: actions/checkout@v7
        with:
          ref: master
          path: repo-master

      - name: Inject Packaging Specification into Tag Source
        shell: bash
        run: |
          cp repo-master/CrapCleaner.spec repo-master/requirements-build.txt repo-tag/
          if [ -d repo-master/scripts ]; then
            mkdir -p repo-tag/scripts
            cp -r repo-master/scripts/* repo-tag/scripts/ || true
          fi

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libfontconfig1 libdbus-1-3 libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xinput0 libx11-xcb1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Windows Standalone Executable
        if: runner.os == 'Windows'
        working-directory: repo-tag
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-build.txt
          pyinstaller --noconfirm --clean CrapCleaner.spec

      - name: Build Linux Standalone Binary
        if: runner.os == 'Linux'
        working-directory: repo-tag
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-build.txt
          pyinstaller --noconfirm --clean CrapCleaner.spec
          chmod +x dist/crapcleaner-linux-x86_64
          cd dist
          tar -czvf crapcleaner-linux-x86_64.tar.gz crapcleaner-linux-x86_64

      - name: Verify the Rebuilt Binary Reports ${{ matrix.tag }}
        shell: bash
        working-directory: repo-tag
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BINARY=./dist/CrapCleaner.exe
          else
            BINARY=./dist/crapcleaner-linux-x86_64
          fi
          EXPECTED="${{ matrix.tag }}"
          EXPECTED="${EXPECTED#v}"
          REPORTED=$("$BINARY" --version | tr -d '\r' | grep -Eo '[0-9]+(\.[0-9]+)+' | head -1)
          echo "reported $REPORTED, rebuilding $EXPECTED"
          test "$REPORTED" = "$EXPECTED"

      - name: Upload Rebuilt Assets
        uses: actions/upload-artifact@v7
        with:
          name: rebuild-${{ matrix.tag }}-${{ runner.os }}
          path: |
            repo-tag/dist/CrapCleaner.exe
            repo-tag/dist/crapcleaner-linux-x86_64
            repo-tag/dist/crapcleaner-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.tag }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(github.event.inputs.tags || '["v1.0.7.1", "v1.0.7", "v1.0.6", "v1.0.5", "v1.0.4", "v1.0.3", "v1.0.2", "v1.0.1", "v1.0.0"]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Assets
        uses: actions/download-artifact@v8
        with:
          name: rebuild-${{ matrix.tag }}-Windows
          path: release-assets

      - name: Download Linux Assets
        uses: actions/download-artifact@v8
        with:
          name: rebuild-${{ matrix.tag }}-Linux
          path: release-assets

      # Replacing a release's binaries without replacing checksums.txt leaves the
      # published sums describing files that are no longer there - a user who follows
      # the project's own verification advice concludes the download was tampered with.
      - name: Regenerate checksums.txt for the Rebuilt Assets
        working-directory: release-assets
        run: |
          sha256sum CrapCleaner.exe crapcleaner-linux-x86_64 crapcleaner-linux-x86_64.tar.gz > checksums.txt
          cat checksums.txt

      - name: Replace the Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          files: |
            release-assets/CrapCleaner.exe
            release-assets/crapcleaner-linux-x86_64
            release-assets/crapcleaner-linux-x86_64.tar.gz
            release-assets/checksums.txt
