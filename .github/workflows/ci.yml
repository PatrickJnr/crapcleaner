name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# A newer push makes an in-flight run obsolete; letting it finish only burns
# minutes and leaves a confusing result next to the run that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff mypy
      - name: Lint with Ruff
        run: |
          ruff check crapcleaner tests
          ruff format --check crapcleaner tests
      - name: Type check with mypy
        run: mypy crapcleaner

  test:
    needs: lint
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libfontconfig1 libdbus-1-3 libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xinput0 libx11-xcb1 libglib2.0-0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov
      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --cov=crapcleaner --cov-report=xml
      - name: Verify Standalone Executable Build
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --clean CrapCleaner.spec
          # A spec that silently stops producing a binary would otherwise pass.
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/CrapCleaner.exe
          else
            test -f dist/crapcleaner-linux-x86_64
          fi
      - name: Upload Coverage Artifact
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
