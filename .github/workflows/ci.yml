name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# A newer push makes an in-flight run obsolete; letting it finish only burns
# minutes and leaves a confusing result next to the run that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-dev.txt
      - name: Lint with Ruff
        run: |
          ruff check crapcleaner tests scripts
          ruff format --check crapcleaner tests scripts
      - name: Type check with mypy
        run: mypy crapcleaner

  test:
    needs: lint
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libfontconfig1 libdbus-1-3 libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-xinput0 libx11-xcb1 libglib2.0-0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-dev.txt
      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --cov=crapcleaner --cov-report=xml --cov-fail-under=70
      - name: Verify Standalone Executable Build
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean CrapCleaner.spec
          # A spec that silently stops producing a binary would otherwise pass.
          EXPECTED=$(python -c "from crapcleaner.constants import VERSION; print(VERSION)")
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/CrapCleaner.exe
            # The launcher used to ignore argv, so every documented CLI command
            # opened the GUI instead when run from the shipped binary.
            ./dist/CrapCleaner.exe --version | grep -q "$EXPECTED"
          else
            test -f dist/crapcleaner-linux-x86_64
            ./dist/crapcleaner-linux-x86_64 --version | grep -q "$EXPECTED"
          fi
      - name: Upload Coverage Artifact
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
