[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crapcleaner"
version = "1.0.8.1"
description = "Modern cleanup and disk-analysis utility"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
crapcleaner = "crapcleaner.app:main"

[tool.setuptools.packages.find]
include = ["crapcleaner*"]

[tool.setuptools.package-data]
crapcleaner = ["assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "dist", "release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["build", "dist", "release"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    build
  | dist
  | release
  | \.venv
)/
'''
